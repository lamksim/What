# On every push to main: publishes the web app to GitHub Pages
# (https://<owner>.github.io/<repo>/). The Android app just opens this page,
# so app updates reach phones without reinstalling.
name: Publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect web files
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js net.js demo.js config.js sw.js manifest.webmanifest icons vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
