# On every push to main:
#  1. publishes the web app to GitHub Pages (https://<owner>.github.io/<repo>/)
#  2. builds the Android app (APK) and attaches it to the "android-latest" release
name: Publish web app and Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect web files
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js drive.js demo.js config.js sw.js manifest.webmanifest icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pigeon.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/pigeon.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with a temporary key. Phones must uninstall the old version before installing a new one."
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          gradle assembleRelease --no-daemon \
            -PwebHost="$OWNER.github.io" -PwebPath="/$REPO/" \
            -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PigeonChat.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PigeonChat-apk
          path: PigeonChat.apk
      - name: Attach APK to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest PigeonChat.apk \
            --title "Pigeon Chat for Android (latest)" \
            --notes "Download PigeonChat.apk on an Android phone and open it to install. Build ${{ github.run_number }}."
