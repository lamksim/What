# Builds the Android app (APK) and attaches it to the "android-latest" release.
# Runs only when the Android wrapper changes, so installed apps keep working.
name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pigeon.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/pigeon.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so the APK is signed with a temporary key. Phones must uninstall the old version before installing a new one."
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          gradle assembleRelease --no-daemon \
            -PwebHost="$OWNER.github.io" -PwebPath="/$REPO/" \
            -PversionCode="${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/PigeonChat.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PigeonChat-apk
          path: PigeonChat.apk
      - name: Attach APK to the "android-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest PigeonChat.apk \
            --title "Pigeon Chat for Android (latest)" \
            --notes "Download PigeonChat.apk on an Android phone and open it to install. Build ${{ github.run_number }}."
